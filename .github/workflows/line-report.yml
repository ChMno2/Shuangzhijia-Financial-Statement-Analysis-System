name: LINE 雙之家 AI 週報（每週日 16:00）

on:
  schedule:
    # 每週日台灣時間 16:00 = UTC 週日 08:00
    - cron: '0 8 * * 0'

  workflow_dispatch:

jobs:
  push-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Push weekly report to LINE
        env:
          BACKEND_API_BASE: ${{ secrets.BACKEND_API_BASE }}
          BACKEND_USERNAME: ${{ secrets.BACKEND_USERNAME }}
          BACKEND_PASSWORD: ${{ secrets.BACKEND_PASSWORD }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TARGET_USER_ID: ${{ secrets.LINE_TARGET_USER_ID }}
        run: python .github/scripts/line_weekly_report.py
