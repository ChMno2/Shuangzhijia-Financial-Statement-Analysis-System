name: LINE 每日天氣預報（上午 10 點推明日）

on:
  schedule:
    # 目標：台灣 10:00；提早 4 小時排程吃掉 GHA cron 固定延遲
    # UTC 21:47 (前一日) = 台灣 05:47 (排程) → 實際送達約 10:00
    - cron: '47 21 * * *'

  workflow_dispatch:

jobs:
  push-weather:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Push weather to LINE
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TARGET_USER_ID: ${{ secrets.LINE_TARGET_USER_ID }}
        run: python .github/scripts/line_weather.py
