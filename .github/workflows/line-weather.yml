name: LINE 每日天氣預報（凌晨 4 點）

on:
  # ─── 測試階段：只開放手動觸發 ───
  # 確認功能穩定後，移除下方註解符號即可恢復「每日 04:00 自動推送」：
  #
  # schedule:
  #   # 每日台灣時間 04:00 = UTC 前一日 20:00
  #   - cron: '0 20 * * *'

  workflow_dispatch:

jobs:
  push-weather:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Push weather to LINE
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TARGET_USER_ID: ${{ secrets.LINE_TARGET_USER_ID }}
        run: python .github/scripts/line_weather.py
