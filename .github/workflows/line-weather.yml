name: LINE 每日天氣預報（上午 10 點推明日）

on:
  schedule:
    # 目標：台灣 10:00；UTC 01:47 = 台灣 09:47
    # 非整點分鐘 + 提早 13 分鐘吃掉 GHA cron 延遲
    - cron: '47 1 * * *'

  workflow_dispatch:

jobs:
  push-weather:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Push weather to LINE
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TARGET_USER_ID: ${{ secrets.LINE_TARGET_USER_ID }}
        run: python .github/scripts/line_weather.py
