name: LINE 每日速報（下午 3 點）

on:
  schedule:
    # GitHub 自己的 schedule 觸發不可靠（實測延遲從 38 分鐘到近 11 小時都有，
    # 甚至整天直接跳過不觸發），所以主要觸發改成外部定時服務（見 README/設定紀錄）
    # 準時呼叫 workflow_dispatch。這個 schedule 只當備援：萬一外部服務哪天沒打進來，
    # 至少還有機會在當天稍晚被 GitHub 自己排到，腳本內的等待邏輯一樣會校正到 15:00。
    # UTC 03:47 = 台灣 11:47
    - cron: '47 3 * * *'

  workflow_dispatch:
    inputs:
      test_now:
        description: '手動測試用：略過等待、立即執行送出（外部定時服務呼叫時會帶 false，走正常等待邏輯）'
        type: boolean
        default: true

jobs:
  push-daily:
    runs-on: ubuntu-latest
    # 可能需要 sleep 到 15:00 才會真正開始推送，故拉長 timeout
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Push daily brief to LINE
        env:
          BACKEND_API_BASE: ${{ secrets.BACKEND_API_BASE }}
          BACKEND_USERNAME: ${{ secrets.BACKEND_USERNAME }}
          BACKEND_PASSWORD: ${{ secrets.BACKEND_PASSWORD }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TARGET_USER_ID: ${{ secrets.LINE_TARGET_USER_ID }}
          TEST_NOW: ${{ inputs.test_now }}
        run: python .github/scripts/line_daily_report.py
