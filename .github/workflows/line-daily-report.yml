name: LINE 每日速報（下午 3 點）

on:
  schedule:
    # GHA 排程本身不保證準時：實測這個 workflow 過去延遲從 38 分鐘到 2.5 小時都有，
    # 「提早 N 分鐘」這種固定補償量無法同時應付兩種情況。
    # 改成：提早很多觸發（給足夠 buffer 蓋過最壞延遲），實際送達時間交給
    # 腳本內的「精確等到台灣時間 15:00」邏輯處理，不管 GHA 幾點真的開始跑，
    # 都會等到 15:00 整才推送。
    # UTC 03:47 = 台灣 11:47（排程觸發，留 3 小時以上 buffer）
    - cron: '47 3 * * *'

  workflow_dispatch:

jobs:
  push-daily:
    runs-on: ubuntu-latest
    # 可能需要 sleep 到 15:00 才會真正開始推送，故拉長 timeout
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Push daily brief to LINE
        env:
          BACKEND_API_BASE: ${{ secrets.BACKEND_API_BASE }}
          BACKEND_USERNAME: ${{ secrets.BACKEND_USERNAME }}
          BACKEND_PASSWORD: ${{ secrets.BACKEND_PASSWORD }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TARGET_USER_ID: ${{ secrets.LINE_TARGET_USER_ID }}
        run: python .github/scripts/line_daily_report.py
