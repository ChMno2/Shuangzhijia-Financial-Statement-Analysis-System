name: LINE 每日速報（下午 4 點）

on:
  schedule:
    # 每日台灣時間 16:00 = UTC 08:00
    # 沒銷售資料當天會在腳本內判斷後跳過推送
    - cron: '0 8 * * *'

  workflow_dispatch:

jobs:
  push-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Push daily brief to LINE
        env:
          BACKEND_API_BASE: ${{ secrets.BACKEND_API_BASE }}
          BACKEND_USERNAME: ${{ secrets.BACKEND_USERNAME }}
          BACKEND_PASSWORD: ${{ secrets.BACKEND_PASSWORD }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TARGET_USER_ID: ${{ secrets.LINE_TARGET_USER_ID }}
        run: python .github/scripts/line_daily_report.py
