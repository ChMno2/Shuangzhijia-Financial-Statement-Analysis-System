name: LINE 每日速報（下午 4 點）

on:
  schedule:
    # 目標：台灣 16:00；提早 4 小時排程吃掉 GHA cron 固定延遲
    # UTC 03:47 = 台灣 11:47 (排程) → 實際送達約 16:00
    # 沒銷售資料當天會在腳本內判斷後跳過推送
    - cron: '47 3 * * *'

  workflow_dispatch:

jobs:
  push-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Push daily brief to LINE
        env:
          BACKEND_API_BASE: ${{ secrets.BACKEND_API_BASE }}
          BACKEND_USERNAME: ${{ secrets.BACKEND_USERNAME }}
          BACKEND_PASSWORD: ${{ secrets.BACKEND_PASSWORD }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TARGET_USER_ID: ${{ secrets.LINE_TARGET_USER_ID }}
        run: python .github/scripts/line_daily_report.py
