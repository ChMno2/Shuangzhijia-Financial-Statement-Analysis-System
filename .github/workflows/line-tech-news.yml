name: LINE 科技新聞推播（上午 10 點）

on:
  schedule:
    # 目標：台灣 10:00；UTC 01:52 = 台灣 09:52
    # 與天氣排程錯開 5 分鐘避免同時搶 runner
    - cron: '52 1 * * *'

  workflow_dispatch:

jobs:
  push-news:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Push tech news to LINE
        env:
          TECH_LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.TECH_LINE_CHANNEL_ACCESS_TOKEN }}
          TECH_LINE_TARGET_USER_ID: ${{ secrets.TECH_LINE_TARGET_USER_ID }}
        run: python .github/scripts/line_tech_news.py
