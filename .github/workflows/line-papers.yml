name: LINE AI 論文精選（上午 8 點）

on:
  schedule:
    # 目標：台灣 08:00；提早 4 小時排程吃掉 GHA cron 的固定延遲
    # UTC 19:47 (前一日) = 台灣 03:47 (排程) → 實際送達約 08:00
    - cron: '47 19 * * *'

  workflow_dispatch:

jobs:
  push-papers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Push AI papers to LINE
        env:
          PAPERS_LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.PAPERS_LINE_CHANNEL_ACCESS_TOKEN }}
          PAPERS_LINE_TARGET_USER_ID: ${{ secrets.PAPERS_LINE_TARGET_USER_ID }}
          # 摘要引擎：預設 claude（claude-haiku-4-5 便宜小模型）；可設 LLM_PROVIDER=gemini 切換
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'claude' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python .github/scripts/line_papers.py
