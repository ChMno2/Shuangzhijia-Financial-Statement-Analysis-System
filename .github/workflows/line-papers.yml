name: LINE AI 論文精選（上午 8 點）

on:
  schedule:
    # 目標：台灣 08:00 推送；UTC 23:47 (前一日) = 台灣 07:47
    # 用非整點分鐘 + 提早 13 分鐘吃掉 GitHub Actions cron 通常 ~15 分鐘的延遲
    - cron: '47 23 * * *'

  workflow_dispatch:

jobs:
  push-papers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Push AI papers to LINE
        env:
          PAPERS_LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.PAPERS_LINE_CHANNEL_ACCESS_TOKEN }}
          PAPERS_LINE_TARGET_USER_ID: ${{ secrets.PAPERS_LINE_TARGET_USER_ID }}
          # 摘要引擎：預設 claude（claude-haiku-4-5 便宜小模型）；可設 LLM_PROVIDER=gemini 切換
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'claude' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python .github/scripts/line_papers.py
